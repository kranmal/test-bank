name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app is served inside the job by Playwright's webServer, so BASE_URL keeps its default.
  TEST_USERNAME: ${{ vars.TEST_USERNAME }}
  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

jobs:
  smoke:
    # Every PR to main. Target: under 10 minutes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Put the app where the test server expects it
        run: mkdir -p app-under-test && cp index.html app-under-test/
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npx playwright test tests/smoke
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            reports/
            test-results/
          retention-days: 14

  regression:
    # Every push (merge) to main. Target: under 40 minutes. Not sharded: under 100 tests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Put the app where the test server expects it
        run: mkdir -p app-under-test && cp index.html app-under-test/
      - run: npx playwright install --with-deps chromium
      - name: Run full regression
        run: npx playwright test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            reports/
            test-results/
          retention-days: 14
